<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061a36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cooper's Travel">
  <meta name="description" content="Cooper's Travel Barnsley - Driven by Wayne">
  <title>Cooper's Travel | Driven by Wayne</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #061a36;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      background: #061a36;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot {
      position: absolute;
      display: block;
      border-radius: 18px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot:focus-visible {
      outline: 4px solid white;
      outline-offset: -5px;
    }

    /* Book Your Journey */
    .book {
      left: 3.5%;
      top: 44.7%;
      width: 45.8%;
      height: 8.7%;
    }

    /* Call Wayne */
    .call {
      left: 50.8%;
      top: 44.7%;
      width: 45.7%;
      height: 8.7%;
    }

    /* WhatsApp Wayne */
    .whatsapp {
      left: 3.5%;
      top: 54.5%;
      width: 45.8%;
      height: 8.3%;
    }

    /* Visit Our Website */
    .website {
      left: 50.8%;
      top: 54.5%;
      width: 45.7%;
      height: 8.3%;
    }

    @media (min-width: 701px) {
      body {
        padding: 20px;
      }

      .app {
        border-radius: 14px;
        box-shadow: 0 12px 45px rgba(0,0,0,0.45);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <img
      class="poster"
      src="./harold-premium.png"
      alt="Cooper's Travel premium app screen featuring Harold"
    >

    <a
      class="hotspot book"
      href="https://www.cooperstravelbarnsley.co.uk/contact-us"
      aria-label="Book your journey"
      title="Book your journey">
    </a>

    <a
      class="hotspot call"
      href="tel:07930565671"
      aria-label="Call Wayne"
      title="Call Wayne">
    </a>

    <a
      class="hotspot whatsapp"
      href="https://wa.me/447930565671"
      target="_blank"
      rel="noopener"
      aria-label="WhatsApp Wayne"
      title="WhatsApp Wayne">
    </a>

    <a
      class="hotspot website"
      href="https://www.cooperstravelbarnsley.co.uk/"
      target="_blank"
      rel="noopener"
      aria-label="Visit our website"
      title="Visit our website">
    </a>

  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .catch(error => {
            console.log('Offline setup unavailable', error);
          });
      });
    }
  </script>

</body>
</html>
